# Render Blueprint — MyPortfolio MERN stack (single service)
# One web service serves BOTH the Express API and the built React client.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: myportfolio
    runtime: node
    plan: free
    region: oregon

    # Build: install backend deps, install client deps (with devDeps for vite),
    # build the client bundle
    # Note: the committed client lockfile only carries win32 rollup binaries,
    # so install the Linux binary explicitly (npm/cli#4828 workaround).
    buildCommand: npm install --prefix Backend && npm install --include=dev --prefix client && npm install --prefix client @rollup/rollup-linux-x64-gnu@4.64.6 --no-save && npm run build --prefix client

    # Start: run the Express server (it also serves client/dist)
    startCommand: npm start --prefix Backend

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production
      # MongoDB connection string (required — set in dashboard)
      - key: MONGO_URI
        sync: false
      # JWT auth secret (auto-generated)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      # Admin account seeded on first boot
      - key: ADMIN_NAME
        value: Portfolio Administrator
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Serve the built React client from the same Express service
      - key: SERVE_CLIENT
        value: "true"
      # Empty value = same-origin relative /api/... requests (single-service mode)
      - key: VITE_API_URL
        value: ""
