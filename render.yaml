# Render Blueprint — MyPortfolio MERN stack
# Docs: https://render.com/docs/blueprint-spec

# ---------- Backend API (Web Service) ----------
services:
  - type: web
    name: myportfolio-api
    runtime: node
    plan: free
    rootDir: Backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # MongoDB connection string (required)
      - key: MONGO_URI
        sync: false
      # JWT auth secret (required)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      # Admin account created on first boot
      - key: ADMIN_NAME
        value: Portfolio Administrator
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # CORS: allow the deployed frontend origin
      - key: CLIENT_ORIGIN
        value: https://myportfolio-client.onrender.com

# ---------- Frontend (Static Site) ----------
  - type: web
    name: myportfolio-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    outputDir: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Points to the backend service above
      - key: VITE_API_URL
        value: https://myportfolio-api.onrender.com
